name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. `github.head_ref` is the source
# branch on a pull_request and empty otherwise, so a PR groups with itself rather than with the ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
