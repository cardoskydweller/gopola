name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.18.2
        required: true

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          GOPOLA_BUILD_SHA=$(git rev-parse --short HEAD) \
          GOPOLA_BUILD_DATE=$(git show -s --format=%cs HEAD) \
          cargo build --release --locked --target "${{ matrix.target }}"
          name="gopola-${VERSION}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/gopola" "$name"
          ./"$name" --version
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          cd dist
          sha256sum gopola-* > SHA256SUMS
          cd ..
          awk -v v="$version" '/^## /{p = index($0, "## " v " ")==1; next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for what changed in $version." > notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "gopola $version" --notes-file notes.md
          fi
