# The macOS job: builds llama.cpp (the reranker behind `gopola ask`) and runs the suite on macOS.
# Its own file so it can carry a paths filter (GitHub filters paths per workflow, not per job): a macOS minute
# bills about ten Linux minutes, so the job runs only when what compiles the reranker changes. Branches are merged
# locally and pushed (pull requests are rare), so it runs on a push to any branch; run it by hand for anything else.
# Tests that load the real reranker are #[ignore]d and run by hand on a Mac
# (`GOPOLA_TEST_RERANKER=<gguf> cargo test --release -- --ignored`).
# timeout-minutes is to be set to about twice the first green run's time: the job runs only in the public mirror, and
# has had no green run yet (the 0.21.0 mirror PR is the first).
name: ci-macos
on:
  push:
    # src/main.rs and tests/cli.rs hold macOS-only lines too, but change every release; the local test run on a Mac covers them.
    paths: ["src/ask.rs", "src/rerank.rs", "src/eval.rs", "Cargo.toml", "Cargo.lock", ".github/workflows/ci-macos.yml"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    # Only the public mirror has a macOS runner; runs in the private repo were never given one.
    if: github.repository == 'cardoskydweller/gopola'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --all-targets --locked
